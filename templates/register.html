{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Same "out of box" background logic as login page */
            background-image: 
                linear-gradient(to right, #121212 50%, transparent 50%), 
                url('{% static "background imager.png" %}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-bg-inside {
            background-image: url('{% static "background imager.png" %}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Mobile fallback to a solid dark background */
        @media (max-width: 768px) {
            body { 
                background: #121212; 
            }
        }
    </style>
</head>
<body class="p-4">

    <div class="flex flex-col md:flex-row w-full max-w-5xl bg-[#121212] rounded-3xl overflow-hidden shadow-[0_20px_60px_rgba(0,0,0,0.7)] border border-gray-800/50">

        <div class="w-full md:w-1/2 p-10 md:p-16 flex flex-col justify-center bg-[#121212]">
            <h1 class="text-4xl font-bold text-white mb-2">Register</h1>
            <p class="text-gray-400 text-sm mb-8">Create your student account</p>

            <form method="POST" action="{% url 'register' %}" class="space-y-5">
                {% csrf_token %}

                <div class="border-b border-gray-700 py-1 focus-within:border-purple-400 transition-colors">
                    <label class="block text-xs text-gray-500 uppercase tracking-widest font-semibold">Username</label>
                    <input type="text" name="username" class="w-full bg-transparent border-none text-white focus:ring-0 py-2 px-0" placeholder="johndoe123" required>
                </div>

                <div class="border-b border-gray-700 py-1 focus-within:border-purple-400 transition-colors">
                    <label class="block text-xs text-gray-500 uppercase tracking-widest font-semibold">Email Address</label>
                    <input type="email" name="email" class="w-full bg-transparent border-none text-white focus:ring-0 py-2 px-0" placeholder="john@university.edu" required>
                </div>

                <div class="border-b border-gray-700 py-1 focus-within:border-purple-400 transition-colors">
                    <label class="block text-xs text-gray-500 uppercase tracking-widest font-semibold">Password</label>
                    <input type="password" name="password1" class="w-full bg-transparent border-none text-white focus:ring-0 py-2 px-0" placeholder="••••••••" required>
                </div>

                <div class="border-b border-gray-700 py-1 focus-within:border-purple-400 transition-colors">
                    <label class="block text-xs text-gray-500 uppercase tracking-widest font-semibold">Confirm Password</label>
                    <input type="password" name="password2" class="w-full bg-transparent border-none text-white focus:ring-0 py-2 px-0" placeholder="••••••••" required>
                </div>

                <button type="submit" class="w-full bg-[#9d7cfd] hover:bg-[#8b66f5] text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-purple-900/20 transition-all active:scale-95">
                    Create Account
                </button>
            </form>

            <div class="mt-10 flex items-center justify-between">
                <span class="text-gray-500 text-sm">Already have an account?</span>
                <a href="{% url 'login' %}" class="bg-[#2a2a2a] text-white px-6 py-2 rounded-xl text-sm font-medium hover:bg-gray-700 transition">Login</a>
            </div>
        </div>

        <div class="hidden md:flex w-1/2 custom-bg-inside p-12 flex-col justify-between relative">
            <div class="absolute inset-0 bg-black/10"></div>

            <div class="relative z-10">
                <h2 class="text-5xl font-bold text-white leading-tight drop-shadow-md">Join the <br> student portal</h2>
                <p class="text-white mt-4 opacity-90 text-lg">Start your journey with us today.</p>
            </div>

            <div class="relative z-10">
                <img src="{% static 'picture_for_login_psge-removebg-preview.png' %}" alt="Illustration" class="w-full h-auto max-w-[320px] mx-auto drop-shadow-2xl">
            </div>
        </div>

    </div>

</body>
</html>
